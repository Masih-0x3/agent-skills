name: validate-skills

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install jsonschema (optional full schema checks)
        run: pip install jsonschema
      - name: Validate all skills
        run: ./scripts/validate-all.sh
      - name: Build curated Lovable export
        run: python3 scripts/export_lovable.py --profile general-use --output dist/lovable --check
      - name: Upload curated Lovable export
        uses: actions/upload-artifact@v4
        with:
          name: lovable-general-use
          path: dist/lovable
          if-no-files-found: error
